<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Reset Email</title>
    <style>
      body {
        background-color: #fafafa;
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        padding: 30px;
      }
      .wrapper {
        background: white;
        max-width: 610px;
        margin: 0 auto;
        border-radius: 8px;
        text-align: center;
        padding: 40px 30px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
      }
      h1 {
        font-weight: 700;
        color: #222;
      }
      p {
        color: #555;
        font-size: 16px;
        margin: 25px 0 40px;
      }
      a.button {
        display: inline-block;
        background-color: #ff6600;
        color: white;
        font-weight: 600;
        text-decoration: none;
        padding: 16px 36px;
        border-radius: 30px;
        font-size: 16px;
      }
      .small-text {
        font-size: 12px;
        color: #aaa;
        margin-top: 30px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <h1>Password Reset Request</h1>
      <p>Hello {{name}},</p>
      <p>
        We received a request to reset your password. Click the button below to
        set a new password.
      </p>
      <a href="{{link}}" class="button">Reset Password</a>
      <p class="small-text">
        If you didn't request this, you can safely ignore this email.
      </p>
      <p class="small-text">Thanks,<br />Contacts App Team</p>
    </div>
  </body>
</html>
